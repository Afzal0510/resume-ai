services:
  # Backend Service (Node.js / Express)
  - type: web
    name: resume-ai-backend
    env: node
    plan: free
    region: oregon

    rootDirectory: backend

    buildCommand: npm install
    startCommand: node server.js

    envVars:
      - key: NODE_ENV
        value: production

      # Set your real Anthropic API key in the Render dashboard
      - key: ANTHROPIC_API_KEY
        sync: false

  # Frontend Service (Create React App → static site)
  - type: web
    name: ai-resume-pro
    env: static
    plan: free
    region: oregon

    rootDirectory: frontend

    buildCommand: npm install && REACT_APP_API_URL=https://resume-ai-backend-m7j5.onrender.com npm run build
    staticPublishPath: ./build

    routes:
      - type: rewrite
        source: /*
        destination: /index.html